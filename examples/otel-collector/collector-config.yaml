# Local OpenTelemetry Collector for verifying OTLP metrics export.
#
# Temporal Worker --OTLP--> this Collector --> debug (console) output
#
# Run with Docker (from the repo root):
#   docker run --rm \
#     -p 4317:4317 -p 4318:4318 \
#     -v "$(pwd)/examples/otel-collector/collector-config.yaml:/etc/otelcol-contrib/config.yaml" \
#     otel/opentelemetry-collector-contrib:latest
#
# Or with Docker Compose:
#   docker compose -f examples/otel-collector/docker-compose.yaml up

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
