services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    environment:
      # Set these in your shell or in a .env file before running docker compose.
      # NEVER commit real token values to git.
      # DT_AUTH_HEADER format depends on token type:
      #   Access token (dt0c01.*):  Api-Token <token>
      #   Service token (dt0s16.*): Bearer <token>
      - DT_OTLP_ENDPOINT=${DT_OTLP_ENDPOINT}
      - DT_AUTH_HEADER=${DT_AUTH_HEADER}
    volumes:
      - ./otel-collector-dynatrace.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317' # OTLP/gRPC
      - '4318:4318' # OTLP/HTTP
    # Keep the container attached so you can watch debug logs.

# Run with:
#   docker compose --env-file .env -f examples/otel-collector/docker-compose-dynatrace.yaml up
