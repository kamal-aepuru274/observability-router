# OpenTelemetry Collector configuration that forwards metrics to Sumo Logic.
#
# Replace the placeholder endpoint with your real Sumo Logic HTTP Source URL.
# No credentials are required to validate the file structure locally, but the
# exporter will not work until a real endpoint is provided.
#
# The collector pipeline below receives OTLP (gRPC and HTTP) and sends it
# using the Sumo Logic exporter. For local verification, swap the `sumologic`
# exporter for `debug` (see examples/otel-collector/collector-config.yaml).
#
# Run with Docker (from the repo root):
#   docker run --rm \
#     -p 4317:4317 -p 4318:4318 \
#     -v "$(pwd)/examples/sumologic/collector-config.yaml:/etc/otelcol-contrib/config.yaml" \
#     otel/opentelemetry-collector-contrib:latest
#
# Or with the shared Docker Compose stack:
#   COLLECTOR_CONFIG=./examples/sumologic/collector-config.yaml docker compose up

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  sumologic:
    # Replace with your actual Sumo Logic HTTP Source URL from Step 1.
    # Example: https://endpoint1.collection.us2.sumologic.com/receiver/v1/http/XXXXXXXX
    endpoint: ${SUMOLOGIC_HTTP_SOURCE_URL}
    compression: gzip
    max_request_body_size: 2097152
  debug:
    verbosity: detailed

service:
  telemetry:
    logs:
      level: debug
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [sumologic, debug]
